<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%" fx="45%" fy="25%">
      <stop offset="0%" stop-color="#1e1833" />
      <stop offset="60%" stop-color="#110d1c" />
      <stop offset="100%" stop-color="#08060d" />
    </radialGradient>

    <!-- Linear Blade Gradients -->
    <linearGradient id="bladeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a29bfe" />
      <stop offset="60%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#3d2f8a" />
    </linearGradient>

    <linearGradient id="bladeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6c5ce7" />
    </linearGradient>

    <linearGradient id="bladeCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#8c7ae6" />
      <stop offset="100%" stop-color="#19152b" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Container Canvas (Continuous Rounded Shield) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#6c5ce7" stroke-width="3" stroke-opacity="0.25" />

  <!-- Ambient Internal Glow Behind Graphic -->
  <circle cx="256" cy="245" r="110" fill="#6c5ce7" opacity="0.25" filter="url(#neonGlow)" />

  <!-- The Architectural Infinite Codex -->
  <g transform="translate(0, 5)">
    <!-- Back Leaf / Left Page Wing -->
    <path d="M 160 135 L 256 195 L 256 375 L 160 305 Z" 
          fill="url(#bladeLeft)" 
          opacity="0.85" />

    <!-- Isometric Floor Projection / Horizon Shelf -->
    <polygon points="256,375 160,305 256,260 352,305" 
             fill="#141026" 
             stroke="#6c5ce7" 
             stroke-width="3" 
             stroke-linejoin="round" />

    <!-- Forward Dynamic Leaf / Right Wing (Continuous Flow) -->
    <path d="M 352 135 L 256 195 L 256 375 L 352 305 Z" 
          fill="url(#bladeRight)" />

    <!-- Core Dynamic Chevron (Ascending Chevron / Continuous Feed Marker) -->
    <polygon points="256,120 315,165 256,205 197,165" 
             fill="url(#bladeCore)" 
             filter="url(#neonGlow)" />

    <!-- Laser Spine Division Line -->
    <line x1="256" y1="120" x2="256" y2="375" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          opacity="0.9" />

    <!-- Digital Data Node Dots -->
    <circle cx="256" cy="120" r="5" fill="#00f2fe" />
    <circle cx="197" cy="165" r="3.5" fill="#a29bfe" />
    <circle cx="315" cy="165" r="3.5" fill="#00f2fe" />
  </g>
</svg>
