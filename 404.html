<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Readover — Redirecting</title>
  <style>
    :root {
      --paper: #f5f5f0;
      --ink: #1f2421;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1c1c1a;
        --ink: #e2e4dc;
      }
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    a {
      color: inherit;
      text-decoration: underline;
      font-weight: 500;
    }
  </style>
  <script>
    // GitHub Pages SPA redirect: preserves path, query params, and hash by redirecting to root
    (function () {
      var pathSegmentsToKeep = 0; // standard custom domain or root repository
      var l = window.location;
      // If hosted under username.github.io/repo/, identify the repo segment
      var path = l.pathname;
      var repoMatch = path.match(/^\/([^/]+)\//);
      var repoPrefix = '';
      if (repoMatch && !l.hostname.endsWith('.github.io')) {
        // apex or custom domain
        repoPrefix = '';
      }
      // Redirect to index.html with the original path stored as hash or query
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (repoMatch ? '/' + repoMatch[1] + '/' : '/') +
        '?p=' + encodeURIComponent(path + l.search + l.hash)
      );
    })();
  </script>
</head>
<body>
  <p>Loading Readover… If you are not redirected automatically, <a href="./">click here to open Readover</a>.</p>
</body>
</html>
