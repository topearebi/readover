<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Notes Deck</title>

  <!-- PWA Meta -->
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>

  <!-- Top Floating Header -->
  <header class="app-header">
    <div class="header-left">
      <select id="vault-select" aria-label="Select Vault">
        <!-- Injected dynamically -->
      </select>

      <select id="folder-select" aria-label="Select Folder">
        <option value="ALL">All Folders</option>
      </select>

      <div class="feed-filter-toggle">
        <button id="filter-all-btn" class="filter-btn active">Feed</button>
        <button id="filter-starred-btn" class="filter-btn">★ Starred</button>
      </div>
    </div>

    <div class="header-right">
      <button id="theme-btn" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">🌙</button>
      <button id="sync-btn" class="icon-btn" title="Sync Repository" aria-label="Sync Repository">↻</button>
      <button id="settings-btn" class="icon-btn" title="Vault Settings" aria-label="Vault Settings">⚙</button>
    </div>
  </header>

  <!-- Fullscreen Snap Feed Container -->
  <main id="feed-viewport" class="feed-viewport">
    <!-- Snap cards inject here -->
  </main>

  <!-- Floating Action Button (+ New Note) -->
  <button id="fab-create-btn" class="fab-create" title="Create New Note" aria-label="Create New Note">+</button>

  <!-- Status Indicator -->
  <div id="status-indicator" class="status-indicator"></div>

  <!-- Multi-Vault Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Vault Settings</h2>
        <button id="add-vault-btn" class="btn-secondary">+ New Vault</button>
      </div>

      <!-- Account-Wide Token (Classic PAT) -->
      <section class="global-auth-card">
        <div class="global-auth-header">
          <h3>GitHub Account Token</h3>
          <span id="global-token-status" style="font-size: 11px; font-weight: 700; color: var(--text-muted);">Optional</span>
        </div>
        <p class="global-auth-desc">
          Add a Classic PAT (with <code>repo</code> scope) once to access all public and private vaults without entering credentials per repo.
        </p>
        <input type="password" id="cfg-global-token" placeholder="ghp_... (Classic PAT)" />
      </section>

      <!-- Saved Vault Profiles List -->
      <div id="vault-profile-list" class="vault-profile-list"></div>

      <hr class="modal-divider" />

      <!-- Active / New Profile Edit Form -->
      <input type="hidden" id="cfg-id" />
      <label>Vault Nickname
        <input type="text" id="cfg-name" placeholder="e.g. Personal Notes" />
      </label>
      <label>GitHub Owner (User / Org)
        <input type="text" id="cfg-owner" placeholder="e.g. topearebi" />
      </label>
      <label>Repository Name
        <input type="text" id="cfg-repo" placeholder="e.g. notes" />
      </label>
      <label>Branch
        <input type="text" id="cfg-branch" value="main" />
      </label>

      <!-- Collapsible Per-Vault Token Override -->
      <details class="vault-override-details">
        <summary>Advanced: Custom Token Override</summary>
        <div class="vault-override-content">
          <input type="password" id="cfg-token" placeholder="github_pat_... (Overrides Account Token)" />
          <span class="vault-override-hint">Leave blank to inherit the Account Token above, or connect unauthenticated if public.</span>
        </div>
      </details>

      <div class="modal-btn-row">
        <button id="save-vault-btn" class="btn-primary">Save & Sync Vault</button>
        <button class="btn-secondary modal-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Create Note Modal -->
  <div id="create-modal" class="modal">
    <div class="modal-content">
      <h2>Create Note</h2>
      <label>Note Path / Title
        <input type="text" id="new-note-path" placeholder="e.g. zettelkasten/Core concepts.md" />
      </label>
      <label>Content (Markdown)
        <textarea id="new-note-content" class="reader-textarea" style="height: 200px; border: 1.5px solid var(--border-color); border-radius: 10px; padding: 10px;" placeholder="# Your note title..."></textarea>
      </label>
      <div class="modal-btn-row">
        <button id="confirm-create-btn" class="btn-primary">Create & Commit</button>
        <button class="btn-secondary modal-close">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Auto-Update PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();

          reg.addEventListener('updatefound', () => {
            const installingWorker = reg.installing;
            installingWorker.addEventListener('statechange', () => {
              if (
                installingWorker.state === 'installed' &&
                navigator.serviceWorker.controller
              ) {
                window.location.reload();
              }
            });
          });
        }).catch(console.warn);

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>

  <!-- ES Module Bootstrapper -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
