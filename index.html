<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Notes Deck</title>
  
  <!-- PWA Meta -->
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>

  <!-- Top App Navigation -->
  <header class="app-header">
    <div class="header-left">
      <select id="vault-select" aria-label="Select Vault">
        <!-- Injected dynamically -->
      </select>
      <select id="folder-select" aria-label="Select Folder">
        <option value="ALL">All Notes</option>
      </select>
    </div>
    <div class="header-right">
      <button id="theme-btn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">🌙</button>
      <button id="sync-btn" class="icon-btn" title="Sync Manifest" aria-label="Sync Manifest">↻</button>
      <button id="manage-btn" class="icon-btn" title="Manage Feed" aria-label="Manage Feed">☰</button>
      <button id="settings-btn" class="icon-btn" title="Vault Settings" aria-label="Vault Settings">⚙</button>
    </div>
  </header>

  <!-- Swipe Arena -->
  <main class="deck-container">
    <div id="card-stack" class="card-stack"></div>

    <!-- Tactile Action Bar -->
    <nav class="action-bar" aria-label="Card Controls">
      <button id="btn-action-hide" class="action-btn btn-archive" title="Archive / Hide Note" aria-label="Archive Note">
        ✕
      </button>

      <button id="btn-action-star" class="action-btn btn-star" title="Star Note" aria-label="Star Note">
        ★
      </button>

      <button id="btn-action-read" class="btn-read-modal" title="Read Full Note" aria-label="Read Full Note">
        <span>Read Note</span> →
      </button>

      <button id="btn-action-keep" class="action-btn btn-keep" title="Keep in Rotation" aria-label="Keep Note">
        ✓
      </button>
    </nav>

    <div id="status-indicator" class="status-indicator"></div>
  </main>

  <!-- Multi-Vault Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Vault Profiles</h2>
        <button id="add-vault-btn" class="btn-secondary">+ New Vault</button>
      </div>

      <div id="vault-profile-list" class="vault-profile-list"></div>

      <hr class="modal-divider" />

      <input type="hidden" id="cfg-id" />
      <label>Vault Nickname
        <input type="text" id="cfg-name" placeholder="e.g. Personal Notes" />
      </label>
      <label>GitHub Owner (Username / Org)
        <input type="text" id="cfg-owner" placeholder="e.g. username" />
      </label>
      <label>Repository Name
        <input type="text" id="cfg-repo" placeholder="e.g. notes" />
      </label>
      <label>Branch
        <input type="text" id="cfg-branch" value="main" />
      </label>
      <label>Personal Access Token (Fine-grained: Contents & Metadata read-only)
        <input type="password" id="cfg-token" placeholder="github_pat_..." />
      </label>

      <div class="modal-btn-row">
        <button id="save-vault-btn" class="btn-primary">Save & Sync Vault</button>
        <button class="btn-secondary modal-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Feed Management Modal -->
  <div id="management-modal" class="modal">
    <div class="modal-content">
      <h2>Feed Management</h2>
      <button id="restore-hidden-btn" class="btn-secondary">Restore All Archived Notes</button>
      <button id="reset-seen-btn" class="btn-secondary">Reset Review History</button>
      <button class="btn-secondary modal-close">Close</button>
    </div>
  </div>


  <!-- Service Worker Registration with Auto-Update Reload -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          // Check for SW updates on page load
          reg.update();

          reg.addEventListener('updatefound', () => {
            const installingWorker = reg.installing;
            installingWorker.addEventListener('statechange', () => {
              if (
                installingWorker.state === 'installed' &&
                navigator.serviceWorker.controller
              ) {
                // New update available; reload to show fresh build
                window.location.reload();
              }
            });
          });
        }).catch(console.warn);

        // Reload if a newly activated service worker takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>

  <!-- Main ES Module Bootstrapper -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
