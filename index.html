<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Notes Deck</title>

  <!-- PWA Meta -->
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>

  <!-- Top Floating Header -->
  <header class="app-header">
    <div class="header-left">
      <select id="vault-select" aria-label="Select Vault">
        <!-- Injected dynamically -->
      </select>

      <select id="folder-select" aria-label="Select Folder">
        <option value="ALL">All Folders</option>
      </select>

      <!-- Feed Mode Switcher (All vs Favorites) -->
      <div class="feed-filter-toggle">
        <button id="filter-all-btn" class="filter-btn active">Feed</button>
        <button id="filter-starred-btn" class="filter-btn">★ Starred</button>
      </div>
    </div>

    <div class="header-right">
      <button id="theme-btn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">🌙</button>
      <button id="sync-btn" class="icon-btn" title="Sync Repository" aria-label="Sync Repository">↻</button>
      <button id="settings-btn" class="icon-btn" title="Vault Settings" aria-label="Vault Settings">⚙</button>
    </div>
  </header>

  <!-- Fullscreen Snap Feed Container -->
  <main id="feed-viewport" class="feed-viewport">
    <!-- Snap cards inject here -->
  </main>

  <!-- Floating Status Indicator for background sync / loads -->
  <div id="status-indicator" class="status-indicator"></div>

  <!-- Multi-Vault Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Vault Profiles</h2>
        <button id="add-vault-btn" class="btn-secondary">+ New Vault</button>
      </div>

      <div id="vault-profile-list" class="vault-profile-list"></div>

      <hr class="modal-divider" />

      <input type="hidden" id="cfg-id" />
      <label>Vault Nickname
        <input type="text" id="cfg-name" placeholder="e.g. Personal Notes" />
      </label>
      <label>GitHub Owner (Username / Org)
        <input type="text" id="cfg-owner" placeholder="e.g. username" />
      </label>
      <label>Repository Name
        <input type="text" id="cfg-repo" placeholder="e.g. notes" />
      </label>
      <label>Branch
        <input type="text" id="cfg-branch" value="main" />
      </label>
      <label>Personal Access Token (Fine-grained: Contents & Metadata read-only)
        <input type="password" id="cfg-token" placeholder="github_pat_..." />
      </label>

      <div class="modal-btn-row">
        <button id="save-vault-btn" class="btn-primary">Save & Sync Vault</button>
        <button class="btn-secondary modal-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Auto-Update PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();

          reg.addEventListener('updatefound', () => {
            const installingWorker = reg.installing;
            installingWorker.addEventListener('statechange', () => {
              if (
                installingWorker.state === 'installed' &&
                navigator.serviceWorker.controller
              ) {
                window.location.reload();
              }
            });
          });
        }).catch(console.warn);

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>

  <!-- ES Module Entry -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
